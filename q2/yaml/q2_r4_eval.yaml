evaluation:
  agent_params:
    agent_name: "CORTEX_AGENT_LAB.AGENTS.EVAL_AGENT_R4"
    agent_type: "CORTEX AGENT"
  run_params:
    label: "Q1 R4 - 8 Views"
    description: "Testing routing accuracy with 8 semantic views attached"
  source_metadata:
    type: "dataset"
    dataset_name: "CORTEX_AGENT_LAB.EVAL.Q1_EVAL_DATASET_V1"

metrics:
  - "answer_correctness"
  - name: "routing_accuracy"
    score_ranges:
      min_score: [1, 3]
      median_score: [4, 6]
      max_score: [7, 10]
    prompt: |
      Evaluate whether the agent used the correct data source to answer this question.
      Rate from 1-10 where 10 means the agent picked exactly the right tool and gave a correct answer,
      5 means it gave a plausible but not ideal answer, and 1 means it picked the wrong tool or failed.

      You can compare the {{output}} with the {{ground_truth}} to help evaluate routing correctness.

      Return only a numeric score from 1 to 10.